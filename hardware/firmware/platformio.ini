[platformio]
default_envs = sensor, actuator

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.3.1
build_flags = -I include

[env:sensor]
build_src_filter = +<sensor.cpp>

[env:actuator]
build_src_filter = +<actuator.cpp>

[env:sensor-sim]
extends = env:sensor
build_flags = ${env.build_flags} -DDUSTTWIN_VIRTUAL_INPUT=1

[env:actuator-sim]
extends = env:actuator
build_flags = ${env.build_flags} -DDUSTTWIN_VIRTUAL_INPUT=1 -DDUSTTWIN_SIM_TRAVEL_MS=3000
